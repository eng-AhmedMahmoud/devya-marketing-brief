name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: eng-AhmedMahmoud/devya-workflows/.github/workflows/node-quality.yml@v1
    with:
      package-manager: pnpm
      build-command: pnpm run build
      # dev.to replies routine and YouTube metadata tests (no network), then the
      # social quality gate: fails on an untagged, off-site or Vercel link in the
      # calendar or the YouTube episodes (render/validate.mjs).
      test-command: node --test social/devto/*.test.mjs social/youtube/youtube.test.mjs && node social/render/validate.mjs --images
  security:
    uses: eng-AhmedMahmoud/devya-workflows/.github/workflows/node-security.yml@v1
    with:
      package-manager: pnpm
